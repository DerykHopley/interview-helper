# Type checks, lint and all tests on every push (spec #1). No real model calls: tests fake the Model Gateway and
# OpenRouter's HTTP, and no model API keys are available here.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
